[project]
name = "maritime-anomaly"
version = "0.1.0"
description = "Region-agnostic, unsupervised detection of anomalous vessel behavior from AIS data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "requests>=2.31",
    "h3>=4.0",
    "scipy>=1.11",
    "tqdm>=4.66",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4", "scipy>=1.11", "torch>=2.2", "torchvision>=0.17"]
app = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "scikit-learn>=1.4"]   # sklearn: risk scoring
sar = ["rasterio>=1.3", "shapely>=2.0", "pyogrio>=0.7", "matplotlib>=3.7", "kaggle>=2.0; python_version >= '3.11'"]
infer = ["torch>=2.2", "torchvision>=0.17"]   # CPU inference
dev = ["pytest>=8.0", "ruff>=0.5", "jupyterlab>=4.0", "matplotlib>=3.7"]   # matplotlib: sar gallery

[project.scripts]
maritime = "maritime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maritime"]
# reference/mid.csv and web/static/* ship inside the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Naive datetimes are deliberate: all timestamps are UTC, matching the canonical schema.
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
